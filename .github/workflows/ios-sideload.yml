name: Build app releases
run-name: Release ${{ github.ref_name }} ${{ inputs.request_id }}

# Manual while we establish iPhone playback. No automatic builds on every push.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional identifier supplied by the local release command
        type: string
        default: ''
      check_simulator:
        description: Run the experimental iOS simulator startup check (slower)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned iPhone and iPad release
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/client
    env:
      FLUTTER_VERSION: '3.47.9'
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check build tools
        run: |
          flutter config --no-analytics
          flutter --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Verify native artwork conversion without Flutter rendering
        run: |
          mkdir -p build/ci
          xcrun --sdk macosx swiftc -parse-as-library \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            ios/Runner/SystemArtwork.swift ../../tools/check_system_artwork.swift \
            -o build/ci/check-system-artwork
          build/ci/check-system-artwork

      - name: Verify native audio share representations
        timeout-minutes: 2
        run: |
          xcrun --sdk macosx swiftc -parse-as-library \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            ios/Runner/AudioShareProvider.swift ../../tools/check_audio_share.swift \
            -o build/ci/check-audio-share
          build/ci/check-audio-share

      - name: Build for physical iPhones and iPads
        # Release mode supports launching from the home screen without a debugger.
        # Flutter manages this project's Swift Package Manager dependencies.
        run: |
          mkdir -p build/ci
          flutter build ios --release --no-codesign --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" 2>&1 | tee build/ci/ios-build.log

      - name: Package unsigned IPA
        id: package_ios
        run: |
          bash ../../tools/package_ios.sh \
            build/ios/iphoneos/Runner.app \
            build/ci/hyperstream-ios-unsigned.ipa
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Run: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Attempt: %s\n' "$GITHUB_RUN_ATTEMPT"
            flutter --version
            xcodebuild -version
          } > build/ci/build-info.txt
          python3 ../../tools/release_artifacts.py ios --output build/ci

      - name: Launch app in iOS simulator
        id: simulator
        if: ${{ inputs.check_simulator }}
        timeout-minutes: 22
        run: bash ../../tools/check_ios_startup.sh

      - name: Upload sideload package
        # Preserve a successfully packaged IPA even if the simulator
        # check fails; the workflow still reports the failed check.
        if: ${{ !cancelled() && steps.package_ios.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hyperstream-ios-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/client/build/ci/hyperstream-ios-unsigned.ipa
            apps/client/build/ci/hyperstream-ios-unsigned.ipa.sha256
            apps/client/build/ci/build-info.txt
            apps/client/build/ci/release-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload native build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ios-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            apps/client/build/ci/ios-build.log
            apps/client/build/ci/ios-startup*.log
            apps/client/build/ci/ios-startup.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Explain the artifact
        if: ${{ !cancelled() && steps.package_ios.outcome == 'success' }}
        env:
          SIMULATOR_RESULT: ${{ steps.simulator.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### iOS sideload build

          Download the `hyperstream-ios-unsigned` artifact and extract its ZIP.
          Import the `.ipa` inside into AltStore Classic/AltServer for signing
          and installation. This artifact is unsigned and cannot install directly.

          Use a server address reachable from your phone; `localhost` refers to
          the phone itself. No Navidrome address or credentials are baked in.

          The device IPA was compiled and packaged. Validate playback and
          background audio on a physical device after audio changes.
          See `docs/ios-github-actions.md` for installation and device checks.
          SUMMARY
          printf '\nSimulator startup check: **%s**.\n' "$SIMULATOR_RESULT" >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows x64 release
    # VS 2026 rejects the audio plugin's experimental C++17 coroutines.
    # Keep the VS 2022 toolchain until that native dependency is modernized.
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: apps/client
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check release tooling
        working-directory: .
        run: python -m unittest tests.test_release_tools -v

      - name: Verify native account storage
        # Includes a real DPAPI roundtrip using a separate synthetic account key.
        # The hosted VS installation includes the secure-storage plugin's ATL dependency.
        run: flutter test integration_test/account_storage_test.dart -d windows --no-pub

      - name: Verify native playback and queue continuity
        # Always checks saved state in the Windows host; additionally exercises
        # HTTP playback if the runner exposes a real audio output.
        timeout-minutes: 8
        run: flutter test integration_test/playback_smoke_test.dart -d windows --no-pub

      - name: Build Windows release
        run: flutter build windows --release --no-pub --build-number="$env:GITHUB_RUN_NUMBER"

      - name: Bundle Windows runtime and package
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build/windows/x64/runner/Release'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $visualStudio = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$visualStudio) { throw 'Visual Studio C++ toolchain was not found.' }
          $runtime = Get-ChildItem -LiteralPath "$visualStudio/VC/Redist/MSVC" -Directory -Recurse |
            Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.Parent.Name -eq 'x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$runtime) { throw 'Redistributable x64 C++ runtime was not found.' }
          Get-ChildItem -LiteralPath $runtime.FullName -Filter '*.dll' | Copy-Item -Destination $bundle
          $exe = Get-Item -LiteralPath "$bundle/hyperstream_client.exe"
          $env:HYPERSTREAM_WINDOWS_VERSION = $exe.VersionInfo.FileVersion
          python ../../tools/release_artifacts.py windows --source $bundle --output build/ci/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hyperstream-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: apps/client/build/ci/windows/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
