# Flutter's package.json equivalent. Commit this file and pubspec.lock together.
name: hyperstream_client
description: "A native Navidrome library player for iPhone, iPad, and Windows."
# Prevent accidental publishing to the pub.dev package registry.
publish_to: 'none'
# Semantic release version. Bump PATCH for fixes and MINOR for feature releases.
# CI supplies platform build metadata separately from this public version.
version: 0.64.0

environment:
  # Dart SDK constraint. The tested Flutter SDK is 3.47.9 (also pinned in CI).
  sdk: ^3.13.7

# Packages used by the running app, including their native platform plugins.
dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  crypto: ^3.0.8
  cupertino_icons: 2.0.0
  dart_smb2:
    path: packages/dart_smb2
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.4.0
  ffmpeg_kit_flutter_new_audio: 2.5.8
  http: ^1.6.0
  flutter_web_auth_2: 5.1.0
  desktop_webview_window: 0.3.2
  mornye_host:
    path: packages/mornye_host
  path_provider: ^2.1.6
  just_audio:
    path: packages/just_audio
  just_audio_windows:
    path: packages/just_audio_windows
  shared_preferences: ^2.5.6

# Development and test tools, similar to npm devDependencies.
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/
    - assets/icons/iconoir/
    - assets/icons/phosphorLight/
    - assets/icons/lucide/
    - assets/icons/solarLinear/
    - assets/icons/solarOutline/
    - assets/icons/solarBroken/
    - assets/icons/solarLineDuotone/
    - assets/icons/solarBold/
    - assets/icons/solarBoldDuotone/
    - assets/icons/sources/
    - packages/mornye_host/assets/catalog.json
  shaders:
    - shaders/glass.frag
