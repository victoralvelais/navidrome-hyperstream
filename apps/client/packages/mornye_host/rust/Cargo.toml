[package]
name = "hyperstream-mornye-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
publish = false

[lib]
name = "hyperstream_mornye"
crate-type = ["cdylib", "rlib"]

[dependencies]
mornye-extensions = { git = "https://github.com/mornyeapp/Mornye", rev = "45df9860661e9c4e731ef26a60c44b2b5d8cf125" }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
