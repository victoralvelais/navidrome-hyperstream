name: dart_smb2
description: Dart SMB2/3 client built on libsmb2, with listings, streaming reads, atomic downloads, uploads, copies, watches and cancellation. macOS, Windows, Linux, iOS and Android.
version: 0.3.0
homepage: https://github.com/ales-drnz/dart_smb2
repository: https://github.com/ales-drnz/dart_smb2
issue_tracker: https://github.com/ales-drnz/dart_smb2/issues

topics:
  - cross-platform
  - smb2
  - smb3
  - samba
  - libsmb2

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^1.2.1
  crypto: ^3.0.7
  ffi: ^2.1.3
  hooks: ^2.0.2
  meta: ^1.15.0
